[package]
name = "inochi-browser-preview"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
inox2d = { git = "https://github.com/Inochi2D/inox2d", rev = "d4dd9dd7f16b775042cbda44370570abf9a8cf81" }
inox2d-opengl = { git = "https://github.com/Inochi2D/inox2d", rev = "d4dd9dd7f16b775042cbda44370570abf9a8cf81" }
glam = "=0.29.3"
glow = "=0.14.2"
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
console_error_panic_hook = "=0.1.7"
web-sys = { version = "=0.3.77", features = ["HtmlCanvasElement", "WebGl2RenderingContext"] }

[profile.release]
opt-level = "s"
lto = true
